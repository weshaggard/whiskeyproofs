name: Find New Bourbon and Rye Releases

on:
  schedule:
    # Daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automated-find-new-releases
  cancel-in-progress: false

jobs:
  find-new-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: automation

    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: false

      - name: Synchronize automation branch with main
        env:
          GITHUB_APP_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_APP_TOKEN}@github.com/${{ github.repository }}.git
          git config user.name "whiskey-automation[bot]"
          git config user.email "262019200+whiskey-automation[bot]@users.noreply.github.com"
          git fetch origin main
          REMOTE_BRANCH=$(git ls-remote --heads origin automated/find-new-releases)
          if [ -n "$REMOTE_BRANCH" ]; then
            git fetch origin automated/find-new-releases
            git checkout -B automated/find-new-releases FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -b automated/find-new-releases origin/main
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/automation/package-lock.json

      - name: Install Copilot CLI
        run: |
          npm ci --prefix .github/automation
          echo "$GITHUB_WORKSPACE/.github/automation/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run release discovery agent
        env:
          # Fine-grained token for Copilot CLI automation (repo contents + pull requests)
          # Configure in repository/environment secrets as COPILOT_GITHUB_TOKEN
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          test -f .github/prompts/find-new-releases.prompt.md
          copilot -p "$(cat .github/prompts/find-new-releases.prompt.md)" \
            --allow-all-tools --allow-all-urls --autopilot --no-ask-user

      - name: Run data validation script
        run: python3 .github/scripts/validate_whiskey_data.py

      - name: Fix broken URLs
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          test -f .github/prompts/fix-broken-urls.prompt.md
          copilot -p "$(cat .github/prompts/fix-broken-urls.prompt.md)" \
            --allow-all-tools --allow-all-urls --autopilot --no-ask-user

      - name: Fix broken TTB URLs
        run: python3 .github/scripts/validate_ttb_urls.py --apply

      - name: Run URL validation script
        run: python3 .github/scripts/validate_urls.py

      - name: Run TTB URL validation script
        run: python3 .github/scripts/validate_ttb_urls.py

      - name: Refresh GitHub App token
        id: refresh_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Commit and push changes
        id: commit_push
        env:
          GITHUB_APP_TOKEN: ${{ steps.refresh_token.outputs.token }}
        run: |
          git config user.name "whiskey-automation[bot]"
          git config user.email "262019200+whiskey-automation[bot]@users.noreply.github.com"

          # Refresh git credentials — the initial token may have expired after the long agent run
          git remote set-url origin https://x-access-token:${GITHUB_APP_TOKEN}@github.com/${{ github.repository }}.git

          # Ensure we are on the PR branch (create it from current HEAD if it doesn't exist yet)
          CURRENT_BRANCH=$(git branch --show-current)
          if [ "$CURRENT_BRANCH" != "automated/find-new-releases" ]; then
            git checkout -b automated/find-new-releases
          fi

          git reset --quiet HEAD
          git add -- _data/whiskeyindex.csv labels/

          if ! git diff --cached --quiet; then
            git commit -m "Automated bourbon and rye release update"
          fi

          UPSTREAM=origin/main
          if git show-ref --verify --quiet refs/remotes/origin/automated/find-new-releases; then
            UPSTREAM=origin/automated/find-new-releases
          fi
          if git diff --quiet origin/main HEAD -- _data/whiskeyindex.csv labels/ ||
             [ "$(git rev-parse HEAD)" = "$(git rev-parse "$UPSTREAM")" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git push origin automated/find-new-releases
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create or update Pull Request
        if: steps.commit_push.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.refresh_token.outputs.token }}
        run: |
          EXISTING_PR=$(gh pr list --head automated/find-new-releases --base main --json number --jq '.[0].number' 2>/dev/null)

          if [ -z "$EXISTING_PR" ]; then
            PR_BODY=$(printf '%s\n' \
              '## Automated Release Discovery' \
              '' \
              'This PR was generated by the release discovery agent workflow.' \
              '' \
              '### What this workflow does' \
              '- Searches for newly announced bourbon and rye releases' \
              '- Prefers official press releases and official product pages' \
              '- Updates `_data/whiskeyindex.csv` with complete fields, URLs, and TTB label IDs when verified' \
              '- Extends `ReleaseYear` ranges for unchanged recurring releases instead of adding duplicate rows' \
              '- Runs repository validation scripts before creating this PR' \
              '' \
              '---' \
              '*Automated by `.github/workflows/find-new-releases.yml`*')
            gh pr create \
              --head automated/find-new-releases \
              --base main \
              --title "Bourbon and rye release updates" \
              --body "$PR_BODY" \
              --label "automated" \
              --label "release-updates"

            gh pr merge automated/find-new-releases --auto --squash
          else
            echo "PR #${EXISTING_PR} already exists — new commits pushed to existing branch"
          fi
