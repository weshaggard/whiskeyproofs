name: Checkout smoke tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/test_checkout.py"

permissions:
  contents: read

concurrency:
  group: checkout-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout:
    name: ${{ matrix.profile }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [build, releases, labels]
        mode: [baseline, optimized]
    steps:
      - name: Start checkout timer
        run: echo "CHECKOUT_START=$(date +%s)" >> "$GITHUB_ENV"

      # Separate jobs ensure every configuration starts on a fresh runner.
      - name: Original checkout
        if: matrix.mode == 'baseline'
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.profile == 'build' && 1 || 0 }}
          persist-credentials: false

      - name: Optimized build checkout
        if: matrix.mode == 'optimized' && matrix.profile == 'build'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/labels/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Optimized discovery checkout
        if: matrix.mode == 'optimized' && matrix.profile != 'build'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/labels/
            /labels/**/*.md
            /labels/**/*.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Record checkout measurements
        env:
          PROFILE: ${{ matrix.profile }}
          MODE: ${{ matrix.mode }}
        run: |
          elapsed=$(( $(date +%s) - CHECKOUT_START ))
          objects=$(du -sb .git/objects | cut -f1)
          worktree=$(du -sb --exclude=.git . | cut -f1)
          mkdir -p "$RUNNER_TEMP/checkout-results"
          printf '{"profile":"%s","mode":"%s","seconds":%s,"object_bytes":%s,"worktree_bytes":%s}\n' \
            "$PROFILE" "$MODE" "$elapsed" "$objects" "$worktree" \
            > "$RUNNER_TEMP/checkout-results/$PROFILE-$MODE.json"
          {
            echo "### $PROFILE / $MODE"
            echo "- Checkout: $elapsed seconds"
            echo "- Git object storage: $objects bytes"
            echo "- Working tree: $worktree bytes"
            echo "- These are on-disk sizes, not network wire-byte measurements."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test sparse checkout and discovery Git operations
        if: matrix.mode == 'optimized'
        env:
          PROFILE: ${{ matrix.profile }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Read-only authentication for fetches; never persisted in Git config.
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/test_checkout.py "$PROFILE" "$PR_NUMBER"

      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-${{ matrix.profile }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/checkout-results/*.json
          if-no-files-found: warn
          retention-days: 7
